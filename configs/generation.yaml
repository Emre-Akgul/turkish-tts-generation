dataset:
  path: your-namespace/your-dataset
  subset: null
  revision: null
  split: train
  text_column: text
  id_column: null
  # Set these when using a voice-cloning target.
  reference_audio_column: null
  reference_text_column: null
  speaker_id_column: null
  shuffle: true
  seed: 42
  limit: 10

targets:
  - {name: trendyol, engine: voxcpm, model_id: trendyol-tts, batch_size: 1, device: cuda, dtype: float16}
  - {name: chatterbox-v3, engine: chatterbox, model_id: chatterbox-multilingual-v3, batch_size: 1, device: cuda, dtype: float16}
  - {name: voxcpm2, engine: voxcpm, model_id: voxcpm2, batch_size: 1, device: cuda, dtype: float16}
  - {name: orkhon, engine: f5-tts, model_id: orkhon-tts, batch_size: 1, device: cuda, dtype: float16}
  - {name: moss-nano, engine: moss-tts, model_id: moss-tts-nano-100m, batch_size: 1, device: cuda, dtype: bfloat16}
  - {name: supertonic-3, engine: supertonic, model_id: supertonic-3, batch_size: 1, device: cuda, dtype: float32}
  - {name: xtts-v2, engine: xtts, model_id: xtts-v2, batch_size: 1, device: cuda, dtype: float16}
  - {name: omnivoice, engine: omnivoice, model_id: omnivoice, batch_size: 1, device: cuda, dtype: float16}
  - {name: freya, engine: freya, model_id: freya-tts, batch_size: 1, device: cuda, dtype: float32}

output:
  root: outputs
  run_name: comparison
  audio_format: wav
  resume: true
